<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Pick a favourite animal racer, share the starting grid, and launch into Critter Kart for a playful browser racing game packed with colourful karts and track hazards." />
    <meta name="theme-color" content="#f9c74f" />
    <meta name="application-name" content="Critter Kart" />
    <meta name="apple-mobile-web-app-title" content="Critter Kart" />
    <meta property="og:site_name" content="Critter Kart" />
    <meta property="og:title" content="Critter Kart - Pick Your Racer. Go for Distance!" />
    <meta property="og:description" content="Pick a favourite animal racer, share the starting grid, and launch into Critter Kart for a playful browser racing game packed with colourful karts and track hazards." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scottnolan.github.io/critterkart/" />
    <meta property="og:image" content="https://scottnolan.github.io/critterkart/assets/brand/CritterKart-og-image.png" />
    <meta property="og:image:secure_url" content="https://scottnolan.github.io/critterkart/assets/brand/CritterKart-og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Critter Kart" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Critter Kart - Pick Your Racer. Go for Distance!" />
    <meta name="twitter:description" content="Pick a favourite animal racer, share the starting grid, and launch into Critter Kart for a playful browser racing game packed with colourful karts and track hazards." />
    <meta name="twitter:image" content="https://scottnolan.github.io/critterkart/assets/brand/CritterKart-og-image.png" />
    <meta name="twitter:image:alt" content="Critter Kart" />
    <link rel="canonical" href="https://scottnolan.github.io/critterkart/" />
    <title>Critter Kart - Pick Your Racer. Go for Distance!</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/brand/CritterKart-favicon-16px.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/CritterKart-favicon-32px.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/brand/CritterKart-AppleTouch.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="pollPage" class="screen screen--active" aria-labelledby="pollTitle">
        <div class="screen-header screen-header--center">
          <img class="brand-lockup brand-lockup--small" src="./assets/brand/CritterKart-Lockup-01.png" alt="Critter Kart" />
          <h1 id="pollTitle">Pick your racer</h1>
          <p class="lede">Choose a favourite kart, then reveal the starting grid.</p>
        </div>

        <div id="pollOptions" class="poll-options">
          <div id="racerGrid" class="racer-grid" aria-label="Racer voting options"></div>
        </div>
        <div class="poll-actions">
          <button id="skipVote" class="secondary-button" type="button">Skip voting</button>
        </div>
        <div id="voteSubmitPanel" class="vote-submit-panel">
          <button id="submitVote" class="primary-button vote-submit" type="button" disabled>
            Submit vote
          </button>
        </div>

        <div id="resultsPanel" class="results-panel" hidden>
          <div class="results-copy">
            <p class="eyebrow">Fan vote</p>
            <h2>Race day results</h2>
          </div>
          <div id="resultsList" class="results-list"></div>
          <button id="raceCta" class="primary-button" type="button">Start racing</button>
        </div>
      </section>

    </main>

    <script src="./app.js"></script>
  </body>
</html>
